    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(964 169) rotate(90) scale(239 344)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#127694" stop-opacity=".22"/><stop offset="1" stop-color="#0A0C11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="64" y1="107" x2="502" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".65" stop-color="#E6EBF2"/><stop offset="1" stop-color="#97A6B7"/>
