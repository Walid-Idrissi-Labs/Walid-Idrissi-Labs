<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Walid Idrissi</title>
  <desc id="desc">Developer tools. Cloud systems. An obsidian banner with silver typography and a sculptural cyan orbital form.</desc>
  <defs>
